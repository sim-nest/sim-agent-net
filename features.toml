[[feature]]
id = "feature/sim-agent-net/provider-control"
title = "Reusable provider control"
summary = "Register open provider families, preserve independently selectable seats, and bind each seat to an opaque, preopened credential source."
owner = "crate/sim-lib-provider"
audiences = ["code", "framework"]
guidance = "Register each ProviderAdapter with ProviderRegistry, discover every visible provider seat, and open an explicit ProviderSeatId as the existing ModelRunner. Use ProviderInventory to validate the private code-free provider-seats.toml authority, then join readiness through CensusEvidence originating only in the seat's declared registered resource job or typed provider probe. Census emits every configured seat, including unavailable seats, with one redacted reason and safe operator action; it never reads credential/config files or treats a process exit code as login evidence. Use provider/auth-methods, provider/login, provider/status, and provider/logout for setup and session control; these typed operations remain separate from inference. AuthMethod covers api-key, oauth-browser, oauth-device, subscription, broker-owned, and none. Attach redaction-safe AuthMetadata to family or seat cards, record the exact TermsAcknowledgement revision, and let the registry refuse login and open until required terms match. For process brokers, pin BrokerSessionController to the executable identity, exact version, machine-readable mode, supported methods, and event schema; accept typed JSON events only and fail closed on drift or malformed output. Register Codex CLI through CodexCliAdapter as provider/codex-cli with agent-task semantics: declare each opaque CODEX_HOME separately, pin its executable revision, probe literal --version, exec --help, and login status argv, and retain model, effective-config digest, sandbox, workspace, plugin, and approval posture on its seat card. Codex owns subscription or API-key authentication; never turn it into an OpenAI API-key seat. Register Claude CLI independently as provider/claude-cli: declare each opaque CLAUDE_CONFIG_DIR as a seat, enforce subscription terms before any subprocess connection, require exact version plus print/stream-json/model/permission/turn-or-spend support, and retain the config-home and visible-settings digests, selected model, permission mode, and bounds. Claude CLI authentication remains vendor-owned and must never collapse into provider/anthropic-api or read credential files. Register OpenCode through OpenCodeCliAdapter as provider/opencode-cli: each declared config home and local server endpoint is a distinct seat with one immutable transport kind. Pin executable revision, provider, model, agent, config digest, plugin digest, and transport on the harness card; retain the model catalog only as observed digest evidence. Enforce the selected vendor's credential policy before transport and never import OpenCode catalogs or credential files as SIM authority. For Ollama, Lemonade, and LM Studio, register LocalServiceAdapter values through register_local_service_families: every configured endpoint is a stable separate seat, endpoint metadata distinguishes loopback from network posture, and discovery never starts a daemon, loads or downloads a model, or mutates an endpoint. Ollama and Lemonade reject credentials; LM Studio may bind an opaque bearer SecretProvider ref to one seat. Bind SecretProvider refs before opening and resolve each seat's Secret once under ai-runner-secret; BrokerOwned and None never synthesize credential material. Families are open symbols and multiple principals or endpoints within one family remain separate seats. For provider execution that must leave the runtime thread, implement ProviderSeatExecution as plan, ProviderDispatch, and land over owned Send payloads; keep Cx in plan and land only. Compose several seats through Fanout with all, first-good, or quorum policy: it plans every seat on the Cx thread, dispatches split work through the shared WorkerPool, lands deterministic requested-order rows, serializes unsplittable seats honestly, and enforces per-seat capacity and cooldown leases with injectable time. runner/market parallel modes reuse that report engine. Keep environment, file, keyring, interactive, and remote sourcing private to the bound provider, and keep transport and inference in their owning crates."
claims_anchors = [
