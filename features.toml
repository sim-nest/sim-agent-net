[[route]]
id = "route/run-genai-locally"
task = "Run GenAI locally"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-agent-net/model-runner-framework", why = "The runner framework supplies provider-neutral requests, process adapters, loopback HTTP profiles, and loadable model sites for local GenAI execution." },
  { feature = "feature/sim-agent-net/bridge-runtime", why = "BRIDGE carries the checked model-facing packet workflow." },
  { feature = "feature/sim-agent-net/eval-fabric-sites", why = "EvalFabric placement resolves the selected local model site." },
  { specimen = "recipe/sim-agent-net/crates/sim-lib-agent/01-basics/genai-assembly", why = "The assembly recipe is the reusable checked exchange run after placing the local model site." },
  { specimen = "spec-test/sim-agent-net/crates/sim-lib-agent/src/tests/genai_assembly", why = "The checked specimen runs the same recipe through fake, subprocess, loopback Ollama, native provider, and OpenAI-compatible placements." },
]

[[route]]
id = "route/run-genai-with-provider"
task = "Run GenAI through a provider"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-agent-net/model-runner-framework", why = "The runner framework owns HTTP provider profiles and the provider-neutral request and response contract." },
  { feature = "feature/sim-agent-net/bridge-runtime", why = "BRIDGE keeps provider calls inside checked ASK packets and output validation." },
  { specimen = "spec-test/sim-agent-net/crates/sim-lib-bridge/src/tests/ask", why = "The checked ASK specimen validates the exchange contract provider runners answer." },
  { specimen = "recipe/sim-agent-net/crates/sim-lib-agent/01-basics/genai-assembly", why = "The assembly recipe stays backend-neutral while the host places the provider target." },
  { specimen = "spec-test/sim-agent-net/crates/sim-lib-agent/src/tests/genai_assembly", why = "The checked specimen runs that recipe through OpenAI, Anthropic, and OpenAI-compatible provider placements with replacement and capability checks." },
]

