schema = "sim.features"

[[feature]]
id = "feature/sim-agent-net/pure-roadmap-execution"
title = "Pure roadmap execution and reconciliation"
summary = "Reduce correlated phase observations into deterministic execution state, data-only effect requests, and invariant-checked success receipts without granting adapter authority."
owner = "crate/sim-roadmap-exec-core"
audiences = ["code", "framework"]
guidance = "Construct an ExecutionPolicy and canonical MutationPlan, then call reduce or replay with journal observations. Interpret EffectRequest values only in a host adapter and feed resulting observations back through the reducer. A Succeeded state is trustworthy only when returned with the reducer-minted PhaseReceipt; never synthesize receipts or put filesystem, process, model, network, Git, journal, scheduler, or CLI handles in these values."
claims_anchors = ["anchor/crate/sim-roadmap-exec-core"]
claims_specimens = ["spec-test/sim-agent-net/crates/sim-roadmap-exec-core/src/tests"]

[[route]]
id = "route/reconcile-roadmap-phase"
task = "Replay and reconcile one roadmap phase without coupling execution laws to a host"
audiences = ["framework"]
steps = [
  { feature = "feature/sim-agent-net/pure-roadmap-execution", why = "The pure reducer owns correlation, reconciliation, and success admission while returning all requested effects as data." },
  { specimen = "spec-test/sim-agent-net/crates/sim-roadmap-exec-core/src/tests", why = "The transition matrix, hostile correlations, deterministic replay, and forged-success fixture exercise the complete value-machine boundary." },
]

[[feature]]
id = "feature/sim-agent-net/durable-roadmap-execution-journal"
title = "Durable fenced roadmap execution journal"
summary = "Bind bounded, redacted roadmap execution records and typed object references to the generic atomic journal with effect-free fail-closed replay."
owner = "crate/sim-lib-roadmap-runner"
audiences = ["code", "framework"]
guidance = "Open ExecutionJournal with every conduct, policy, source-deck, model-pick, and runner-generation pin. Prepare bounded objects before append, retain the expected JournalHead, and replay after any fence conflict. Consume RebuiltExecution as a projection only: rebuild verifies closure and legality and never repeats an effect. Identity drift requires the deterministic child id; it never mutates an existing execution."
claims_anchors = ["anchor/crate/sim-lib-roadmap-runner"]
claims_specimens = ["spec-test/sim-agent-net/crates/sim-lib-roadmap-runner/src/tests"]
depends_on = ["feature/sim-storage/atomic-content-journal", "feature/sim-agent-net/pure-roadmap-execution"]

[[route]]
id = "route/resume-durable-roadmap-execution"
task = "Resume a roadmap execution from durable history without repeating effects"
audiences = ["framework"]
steps = [
  { feature = "feature/sim-agent-net/durable-roadmap-execution-journal", why = "The adapter verifies execution identity, legal record order, byte limits, and referenced-object closure over the generic fenced journal." },
  { specimen = "spec-test/sim-agent-net/crates/sim-lib-roadmap-runner/src/tests", why = "The focused fixtures cover exact effect-free replay, stale writers, duplicate receipts, identity drift, and secret-shaped payload refusal." },
]

[[feature]]
id = "feature/sim-agent-net/pure-continuity"
title = "Pure intermittent-session continuity"
summary = "Validate versioned continuity plans and deterministically reduce hostile, reordered session events into replayable turns and authority-free intents."
owner = "crate/sim-lib-continuity"
audiences = ["code", "framework"]
guidance = "Use ContinuityPlan plus apply or rebuild for effect-free state derivation, and adapt ContinuityJournal to the delivered fenced journal at the composition boundary. Route candidates are observations, never capabilities. Hosts alone interpret emitted intents; keep platform, device, audio, model, view, wall-clock, and SDK behavior outside this crate."
claims_anchors = ["anchor/crate/sim-lib-continuity"]
claims_specimens = ["recipe/sim-agent-net/crates/sim-lib-continuity/01-basics/hostile-replay"]

[[route]]
id = "route/continue-intermittent-session"
task = "Replay and continue an intermittent multi-role session without hidden host authority"
audiences = ["framework"]
steps = [
  { feature = "feature/sim-agent-net/pure-continuity", why = "The pure reducer validates policy and derives identical turns and intents from fenced journal history." },
  { specimen = "recipe/sim-agent-net/crates/sim-lib-continuity/01-basics/hostile-replay", why = "The checked hostile trace proves empty-cache replay and typed refusal behavior." },
]

[[feature]]
id = "feature/sim-agent-net/loadable-roadmap-command"
title = "Loadable pure roadmap operations"
summary = "Ground, plan, compare, refine, render, and explain bounded roadmap values through one capability-free loaded command library."
owner = "crate/sim-lib-roadmap"
audiences = ["user", "code", "framework"]
guidance = "Load RoadmapLib and call the roadmap/* operations with already admitted caller-owned values. Use cli/main/roadmap only as the standard bootloader handoff. Keep source acquisition, codecs, execution, journals, mutation, models, and outward effects in separately loaded organs; a refinement result is a successor certificate or a typed refusal, never an edited input."
claims_anchors = ["anchor/crate/sim-lib-roadmap", "anchor/export/sim-lib-roadmap/cli/main/roadmap"]
claims_specimens = ["spec-test/sim-agent-net/crates/sim-lib-roadmap/src/tests"]

[enforcement.audience]
user = "strict"
code = "strict"
framework = "strict"

[enforcement.specimen]
user = "strict"
code = "strict"
framework = "strict"

[[route]]
id = "route/operate-on-roadmap-intent"
task = "Ground and refine roadmap intent without execution authority"
features = ["feature/sim-agent-net/loadable-roadmap-command", "feature/sim-agent-net/native-roadmap-document-adapter", "feature/sim-agent-net/certified-roadmap-refinement"]
specimens = ["spec-test/sim-agent-net/crates/sim-lib-roadmap/src/tests"]

[[feature]]
id = "feature/sim-agent-net/native-roadmap-document-adapter"
title = "Strict v3 roadmap document adapter"
summary = "Import legacy v3 Markdown and typed catalogs into observation-separated native roadmap documents, then render native recursive Markdown or a precise flat-v3 loss report."
owner = "crate/sim-lib-roadmap"
audiences = ["code", "framework"]
guidance = "Construct V3Importer with caller-owned referenced-document bytes. Import observes Markdown only through sim-codec-doc, content-pins every origin, keeps lifecycle state outside semantic identity, and marks legacy prose and snippets ungrounded. Decode proof and policy catalogs with import_catalogs so command fields remain argv. Prefer render_native; call render_v3 only when the caller can handle every returned loss path."
claims_anchors = ["anchor/crate/sim-lib-roadmap"]
claims_specimens = ["spec-test/sim-agent-net/crates/sim-lib-roadmap/src/tests"]

[enforcement.audience]
framework = "strict"
code = "strict"

[enforcement.specimen]
framework = "strict"
code = "strict"

[[feature]]
id = "feature/sim-agent-net/certified-roadmap-refinement"
title = "Certified immutable roadmap refinement"
summary = "Replace one grounded roadmap leaf with a bounded finite tree only when every child has a strictly lower derived rank and parent acceptance remains completely covered."
owner = "crate/sim-roadmap-refine"
audiences = ["code", "framework"]
guidance = "Call derive_profile only with an admitted phase and exact Grounding; profiles never accept numeric claims. Submit RefinementProposal to apply_refinement with the pinned TractabilityPolicy and compilation hooks. Accept only the returned successor plus a DescentCertificate whose verify method succeeds. A Refusal mints no revision and leaves the base bytes and identity untouched."
claims_anchors = ["anchor/crate/sim-roadmap-refine"]
claims_specimens = ["spec-test/sim-agent-net/crates/sim-roadmap-refine/src/tests"]
depends_on = ["feature/sim-agent-net/roadmap-refinement-admission"]

[enforcement.audience]
framework = "strict"
code = "strict"

[enforcement.specimen]
framework = "strict"
code = "strict"

[[feature]]
id = "feature/sim-agent-net/roadmap-refinement-admission"
title = "Bounded roadmap refinement admission"
summary = "Admit roadmap decompositions only when they form one bounded tree, narrow every inherited authority envelope, preserve parent acceptance, and make aggregate obligation coverage unambiguous."
owner = "crate/sim-roadmap-core"
audiences = ["code", "framework"]
guidance = "Construct authored PhaseSpec values, then call RoadmapSpec::admit before consuming their decomposition. Read effective envelopes from AdmittedPhase while retaining the authored fields for review. Composite phases must explicitly map every parent obligation to a child contribution or retain it at the parent; supporting child obligations must trace back, and aggregate dependencies may not target self or descendants. Handle the structured Failure path instead of reconstructing graph diagnostics. This is roadmap policy admission, not a scheduler or generic graph worklist."
claims_anchors = ["anchor/crate/sim-roadmap-core"]
claims_specimens = ["spec-test/sim-agent-net/crates/sim-roadmap-core/focused-tests/src/lib"]

[enforcement.audience]
framework = "strict"
code = "strict"

[enforcement.specimen]
framework = "strict"
code = "strict"

[[feature]]
id = "feature/sim-agent-net/immutable-source-decks"
title = "Immutable bounded source decks"
summary = "Ground exact SIM Index declarations, source excerpts, and checked specimens in a portable content-addressed value with explicit limits and limitations."
owner = "crate/sim-source-deck"
audiences = ["code", "framework"]
guidance = "Use sim-source-deck when a caller already holds fragment, certificate, source, and specimen bytes. Decode fragments with a caller-owned FragmentDecoder, then build once; validation is exact and fail-closed. The crate never fetches, scans, parses, or generates artifacts, and SyntaxBound or scanner evidence remains an explicit Limitation."
claims_anchors = ["anchor/crate/sim-source-deck"]
claims_specimens = ["spec-example/sim-agent-net/crates/sim-source-deck/grounded-declaration"]

[enforcement.audience]
user = "strict"
framework = "strict"
code = "strict"

[enforcement.surface]
cli = "strict"
docs = "advisory"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

