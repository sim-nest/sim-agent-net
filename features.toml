[[feature]]
id = "feature/sim-agent-net/agent-conduct-records"
title = "Pure agent conduct records"
summary = "Describe agent run frames, open lifecycle vocabulary, exact domain budgets, step Cards, and canonical hash-linked journals without loading execution behavior."
owner = "crate/sim-lib-agent-conduct-core"
audiences = ["code", "framework"]
guidance = "Use AgentRunFrame as the one packet passed through conduct steps, AgentStepCard to declare an extension step's Shapes and open outcomes, AgentUsageBudget::narrow for caller/agent/conduct limits, and AgentJournal to append or verify redacted canonical records. Register all Citizens through register_citizens for constructor Shapes and general-purpose codec round trips. This crate is data-only: compose execution separately and never put model, tool, topology, runner, bridge, storage, provider, server, or host dependencies below this boundary."
claims_anchors = ["anchor/crate/sim-lib-agent-conduct-core"]
claims_specimens = [
  "recipe/sim-agent-net/crates/sim-lib-agent-conduct-core/01-basics/pure-journal",
]

[[feature]]
id = "feature/sim-agent-net/agent-conduct-topology-profile"
title = "Validated topology-backed agent conducts"
summary = "Certify delivered topology packages as agent/conduct-v1 workflows, bind their step Cards explicitly, and run or resume them through the topology engine."
owner = "crate/sim-lib-agent-conduct"
audiences = ["code", "framework"]
guidance = "Use validate_agent_conduct for the strict RunFrame boundary, Card/outcome-route coverage, derived roles, capabilities, and finish-or-stop admission. Use bind_agent_conduct for exact node/Card bindings, then AgentConduct run or step for topology-owned execution and continuation. The projection retains the original TopologyEntry and never creates another graph, parser, registry, or scheduler."
claims_anchors = ["anchor/crate/sim-lib-agent-conduct"]
claims_specimens = [
  "recipe/sim-agent-net/crates/sim-lib-agent-conduct/01-basics/echo-conduct",
]
depends_on = ["feature/sim-agent-net/agent-conduct-records"]

[[feature]]
id = "feature/sim-agent-net/agent-single-steps"
title = "Effect-safe single agent steps"
summary = "Run model, tool, component, planning, phase, review, delegation, checkpoint, finish, and stop concerns as independently testable single attempts while topology conducts own every retry and repetition edge."
owner = "crate/sim-lib-agent"
audiences = ["code", "framework"]
guidance = "Use the execute_*_once functions for one component, planning, reflection, review, or delegation attempt; use enter_phase, admit_phase_tool, and complete_phase around ordinary model/component/tool nodes; and admit public results only through execute_finish or execute_stop. Certify standard targets with standard_step_cards. Hosts extend conduct through AgentStepRegistry and AgentStepFactory keyed by Card id, without editing agent or conduct source. Budget admission precedes runner opening, delegation, and effects; child authority is diminished at the EvalFabric boundary; provider endpoint, credentials, transport, preference, hidden reasoning, mutable run state, and retry edges never belong to a step factory."
claims_anchors = [
  "anchor/crate/sim-lib-agent",
  "anchor/crate/sim-lib-bridge",
  "anchor/rustdoc/sim-lib-agent/execute_model_turn_once",
  "anchor/rustdoc/sim-lib-agent/model_turn_card",
  "anchor/rustdoc/sim-lib-agent/tool_batch_card",
  "anchor/rustdoc/sim-lib-agent/agent-step-registry",
  "anchor/rustdoc/sim-lib-agent/standard_step_cards",
  "anchor/rustdoc/sim-lib-bridge/run_ask_once",
]
claims_specimens = [
  "spec-test/sim-agent-net/crates/sim-lib-bridge/src/tests/ask",
  "spec-test/sim-agent-net/crates/sim-lib-agent/src/tests/agent_ai_tools",
  "spec-test/sim-agent-net/crates/sim-lib-agent/src/tests/standard_steps",
]
depends_on = [
  "feature/sim-agent-net/agent-conduct-records",
  "feature/sim-agent-net/agent-conduct-topology-profile",
  "feature/sim-agent-net/provider-control",
]

[[feature]]
id = "feature/sim-agent-net/manifest-selected-conduct"
title = "Manifest-selected agent conduct"
summary = "Select one loadable conduct in AgentManifest and execute it identically before start, after start, and after runtime replacement or restart."
owner = "crate/sim-lib-agent"
audiences = ["code", "framework"]
guidance = "Use AgentManifest as the sole assembly center: bind a conduct separately from the existing topology component slot, name provider seats (Provider_4 is the durable compatibility seat), and let each call narrow manifest budget and result-Shape defaults. Omit conduct only for the explicit compatibility conduct. Reflection exposes the conduct id, graph fingerprint, required roles, capabilities, budget, and result contract; unresolved roles fail before execution."
claims_anchors = [
  "anchor/crate/sim-lib-agent",
  "anchor/export/sim-lib-agent/agent/make",
  "anchor/export/sim-lib-agent/agent/derive",
  "anchor/export/sim-lib-agent/agent/start",
]
depends_on = [
  "feature/sim-agent-net/agent-conduct-topology-profile",
  "feature/sim-agent-net/agent-single-steps",
  "feature/sim-agent-net/provider-control",
]

[[feature]]
