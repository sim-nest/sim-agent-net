audiences = ["code", "framework"]
guidance = "Compose this pure package with sim-lib-oauth-http for retrieval and host-provided randomness, consent, browser, and token storage. Preserve exact issuer/resource/scopes through every transition; prefer configured or client-metadata registration and gate deprecated dynamic registration explicitly."
