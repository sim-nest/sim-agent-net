title = "Reusable provider control"
summary = "Register open provider families, preserve independently selectable seats, validate them through one conformance harness, and compose them in ordered fan-out."
owner = "crate/sim-lib-provider"
audiences = ["code", "framework"]
guidance = "Register each ProviderAdapter with ProviderRegistry, discover every visible provider seat, and open an explicit ProviderSeatId as the existing ModelRunner. Validate opened seats with ProviderConformanceHarness, which accepts only ProviderSeatCard and ModelRunner and runs identical checked request, output Shape, streaming, error, and cancellation cases. Declare streaming, tools, structured-output, usage, and workspace-effects on the seat; unsupported behavior refuses before runner invocation. Use ProviderInventory to validate private code-free provider-seats.toml authority and never project its contents publicly. Direct API families, subscription CLI broker families, local-service families, and third-party extensions are adapters on this one organ. Compose API-key, CLI, and daemon seats through Fanout for a deterministic ordered report with distinct principal identities. Keep the checked GenAI assembly recipe as the canonical cross-family specimen; vary only seat data, wire, principal, and declared capability expectations. Keep environment, file, keyring, interactive, and remote sourcing private to the bound provider, and keep transport and inference in their owning crates."
claims_anchors = [
  "anchor/crate/sim-lib-provider",
  "anchor/crate/sim-lib-provider-cli",
  "anchor/rustdoc/sim-lib-provider/provider-adapter",
  "anchor/rustdoc/sim-lib-provider/auth-method",
