[[feature]]
id = "feature/sim-agent-net/model-candidate-identity"
title = "Honest model candidate identity"
summary = "Hash provider-seat, artifact, model, route, defaults, limits, and external harness evidence into an opaque study subject before a request is made."
owner = "crate/sim-lib-model-test"
audiences = ["code", "framework"]
guidance = "Construct CandidateRevision from the delivered ProviderFamilyCard and ProviderSeatCard plus artifact or hosted-epoch evidence. Keep the SIM trial harness in the independent study harness coordinate. Verify each returned identity and quarantine mismatches; after successful provider sync mark missing candidates absent without deleting their evidence. Export only OfflineSnapshot, whose schema excludes principals, endpoint addresses, executable paths, secrets, and account identity."
claims_anchors = [
  "anchor/crate/sim-lib-model-test",
  "anchor/rustdoc/sim-lib-model-test/candidate-revision",
  "anchor/rustdoc/sim-lib-model-test/offline-snapshot",
]
depends_on = ["feature/sim-agent-net/provider-control"]

[[feature]]
id = "feature/sim-agent-net/model-resource-economics"
title = "Replayable model resource economics"
summary = "Seal open resource axes, immutable price revisions, per-attempt attribution, exposure bounds, and exact provider reconciliation before generic study decisions consume them."
owner = "crate/sim-lib-model-test"
audiences = ["code", "framework"]
guidance = "Record model-domain facts with DecisionAxis, PriceObservation, AttemptResourceEvent, ExposureSeal, and reconcile_provider_usage. Prefer measured energy to an explicitly sourced declared power profile; treat missing or expired prices and unreconciled provider usage as unavailable. Feed generic_event into sim-lib-study attribution and its sole cost-per-accepted projection. Keep actual accounts, prices, forecasts, role policy, model inventory, and executable scoring outside this public crate."
claims_anchors = [
  "anchor/crate/sim-lib-model-test",
  "anchor/rustdoc/sim-lib-model-test/decision-axis",
  "anchor/rustdoc/sim-lib-model-test/exposure-seal",
  "anchor/rustdoc/sim-lib-model-test/reconcile_provider_usage",
]
depends_on = ["feature/sim-agent-net/model-candidate-identity"]

[[feature]]
id = "feature/sim-agent-net/model-verdict-picks"
title = "Expiring model verdict and pick projections"
summary = "Project generic study decisions and their sole selection into evidence-preserving model verdicts, portfolio dispositions, and expiring read-only picks."
owner = "crate/sim-lib-model-test"
audiences = ["code", "framework"]
guidance = "Use project_verdict without altering its retained SubjectDecision, then emit_pick from the existing sim-lib-study Selection. Unfit requires failed hard gates across the declared independent-epoch floor; too-expensive requires reconciled cost and a price revision. Treat every named PickRefusal as a missing fact, retain uniquely capable costly candidates as specialists, and leave driver application to the maintainer."
claims_anchors = [
  "anchor/crate/sim-lib-model-test",
  "anchor/rustdoc/sim-lib-model-test/model-pick",
  "anchor/rustdoc/sim-lib-model-test/project-verdict",
]
depends_on = ["feature/sim-agent-net/model-resource-economics"]

[[feature]]
id = "feature/sim-agent-net/model-task-protocols"
title = "Loadable self-checking model task protocols"
summary = "Prepare immutable public trials and grade linked facets through open protocols with repository closure, discrete generation, privacy, and calibrated-judge evidence."
owner = "crate/sim-lib-model-test"
audiences = ["code", "framework"]
guidance = "Implement ModelTaskProtocol for a new task family and register it through ProtocolRegistry. Seal every visible, hidden, parser, grader, calibration, tool, toolchain, seed, and repository-closure input into TaskRevision; use discrete receipts for generated packs; keep deterministic failure authoritative over calibrated judging; and export only content ids and provenance, never hidden task bytes. Reuse the scalar, generated, judged-document, and workspace-mutation fake protocols for conformance."
claims_anchors = [
  "anchor/crate/sim-lib-model-test",
  "anchor/rustdoc/sim-lib-model-test/model-task-protocol",
  "anchor/rustdoc/sim-lib-model-test/protocol-registry",
  "anchor/rustdoc/sim-lib-model-test/task-revision",
]
depends_on = [
  "feature/sim-agent-net/model-candidate-identity",
]

[[feature]]
id = "feature/sim-agent-net/model-test-packs"
title = "Frozen public and private-local model-test packs"
summary = "Rebuild validated task packs from pinned Git objects into immutable epochs, compose open domain portfolios and paired generated capability evidence, and keep private task bytes and active selections behind control-plane loaders."
owner = "crate/sim-lib-model-test-packs"
audiences = ["code", "framework"]
guidance = "Describe tasks with PackManifest and domains with DomainMetadata; load the active DomainPortfolio through the private control plane. Generate bounded target/control pairs from one seed, retain family-specific capability curves, reject language packs that smuggle replacement runtimes or source reparsing, and seal external evaluator bundles by content without treating them as isolation. Implement private loaders and interaction policy only in the control plane; public exports carry digests, never hidden bytes."
claims_anchors = [
  "anchor/crate/sim-lib-model-test-packs",
  "anchor/rustdoc/sim-lib-model-test-packs/pack-manifest",
  "anchor/rustdoc/sim-lib-model-test-packs/fixture-epoch",
  "anchor/rustdoc/sim-lib-model-test-packs/private-pack-loader",
  "anchor/rustdoc/sim-lib-model-test-packs/assistance-session",
  "anchor/rustdoc/sim-lib-model-test-packs/grade_assistance",
]
claims_specimens = [
  "recipe/sim-agent-net/crates/sim-lib-model-test-packs/01-basics/public-conformance",
]
depends_on = ["feature/sim-agent-net/model-task-protocols"]

[[feature]]
id = "feature/sim-agent-net/transport-ports"
title = "Provider-neutral transport ports"
summary = "Keep socket, DNS, and local IPC mechanics behind narrow byte-stream ports while protocol framing and session policy remain unchanged."
owner = "crate/sim-transport-ports"
audiences = ["code", "framework"]
guidance = "Compose SocketPort and DnsPort for network transports and bind IpcPort only when the selected platform offers native local IPC. Use ModelPorts fault profiles for deterministic fragmentation, loss, pressure, resolution failure, collision, cancellation, and half-close tests; never infer a Windows pipe name from a Unix path."
claims_anchors = ["anchor/crate/sim-transport-ports"]

[[feature]]
id = "feature/sim-agent-net/raw-http-server-seam"
title = "Bounded raw streaming HTTP server seam"
summary = "Expose ordered HTTP request facts and pull/push streaming bodies with per-request cancellation, caps, deadline budgets, trailer policy, and write acknowledgement backpressure."
owner = "crate/sim-lib-server"
audiences = ["code", "framework"]
guidance = "Install RawHttpServer beside the ServerFrame adapter in the existing SocketPort/DnsPort accept and parser organ. Implement RawHandler without owning sockets, clocks, executors, or an MCP-specific acceptor; connection adapters must report peer drop and injected-clock timeout through RequestScope."
claims_anchors = ["anchor/crate/sim-lib-server"]
claims_specimens = ["spec-test/sim-agent-net/crates/sim-lib-server/src/raw_http"]

[[feature]]
id = "feature/sim-agent-net/structured-process-program"
title = "Structured bounded process program"
summary = "Project a portable ProcessRequest into bounded stdin/stdout frames, a separate stderr sink, and an explicit exit report through the active ProcessPort."
owner = "crate/sim-lib-agent-runner-process"
audiences = ["code", "framework"]
guidance = "Construct ProcessProgram from the already validated ProcessRequest and dispatch it only through ProcessPort. ArgAtom values are literal bytes, never shell syntax; provider adapters remain responsible for concurrent pipe draining, cancellation, and reaping."
claims_anchors = ["anchor/crate/sim-lib-agent-runner-process"]
claims_specimens = ["spec-test/sim-agent-net/crates/sim-lib-agent-runner-process/src/process"]

[[feature]]
