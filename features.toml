[[feature]]
id = "feature/sim-agent-net/server-wall-clock"
title = "Injectable server wall clock"
summary = "Observe a validated wall clock timestamp in Unix milliseconds through one injectable server contract."
owner = "crate/sim-lib-server"
audiences = ["code", "framework"]
guidance = "Use WallClock and WallTimestamp for optional human timestamps and host scheduling in server-side libraries. Inject DeterministicWallClock for product defaults, tests, and replay; physical capsules implement the same contract. Wall observations may move backward and never replace kernel logical ticks or revisions for correctness ordering."
claims_anchors = [
  "anchor/rustdoc/sim-lib-server/deterministic-wall-clock",
  "anchor/rustdoc/sim-lib-server/wall-clock",
  "anchor/rustdoc/sim-lib-server/wall-timestamp",
]
claims_specimens = [
  "spec-test/sim-agent-net/crates/sim-lib-server/src/clock/tests",
]
supports = [
  "feature/sim-agent-net/agent-server-tools",
]

[[feature]]
id = "feature/sim-agent-net/generated-docs"
title = "Repository documentation surface"
summary = "Publish generated package, card, recipe, and index facts for agent, bridge, MCP, and fabric crates."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this row when checking the generated documentation and index lane for the agent network repo."
claims_anchors = [
  "anchor/cli/xtask",
  "anchor/crate/xtask",
  "anchor/doc/generated/feature-map",
  "anchor/doc/generated/sim-index-fragment",
]
claims_surfaces = [
  "cli/xtask",
  "docs/sim-agent-net/generated",
]

