guidance = "Use this row when adding model execution. Implement `ModelRunner` for an in-process or host adapter, use the HTTP profiles for provider and loopback local GenAI services, use the process runner for subprocess adapters, or expose a loadable `Export::Site` for placement through `runner/place` and `model/at`. The bundled `model-site:local` runner is a modeled fixture; real local execution crosses one of those runner or site boundaries."
