guidance = "Use this row when adding model execution. Register named `provider/openai-api` and `provider/anthropic-api` families for vendor-direct service: every independently authenticated principal is a seat, OpenAI seats explicitly select `openai-chat` or `openai-responses`, and SIM owns API-key resolution through the secret-provider seam. Add a future direct OAuth credential as another typed family or seat on this provider organ, not another execution API. Keep `openai-compatible` as the generic extension identity and keep LM Studio and Lemonade under their named local-service identities even where wire shapes overlap. Implement `ModelRunner` for an in-process or host adapter, use the HTTP profiles for provider and loopback local GenAI services, compose `BrokerProcessSpec` over the active `ProcessPort` for CLI-backed seats, or expose a loadable `Export::Site` for placement through `runner/place` and `model/at`. Process seats carry literal argv, sealed bindings, opaque roots and artifacts, cancellation, and budgets; never add shell strings or ambient host discovery. HTTP profiles and probes compose feature/sim-foundation/blocking-http-client with the active capsule connector; they do not own HTTP framing, TLS roots, redirect, proxy, cap, or sensitive-header policy. HTTP non-streaming inference uses the provider plan, dispatch, and land split so transport work can leave the Cx thread; streaming remains on its Cx-bound path until its family supports an honest split. The bundled `model-site:local` runner is a modeled fixture; real local execution crosses one of those runner or site boundaries."
