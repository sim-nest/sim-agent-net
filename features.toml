frameworks = "advisory"

[[feature]]
id = "feature/sim-agent-net/immutable-web-capture"
title = "Policy-gated immutable web capture"
summary = "Capture landing pages through separate egress and robots decisions into caller-owned content-addressed evidence, with explicit cache modes and fenced model rendering."
owner = "crate/sim-lib-web-fetch"
audiences = ["user", "code", "framework"]
guidance = "Use WebFetcher with an injected HTTP executor, CaptureDir, and EgressPolicy. Choose Live, PreferCache, Offline, or Revalidate explicitly; Offline names a capture ContentId and performs no network effect. Consume normalized text only through the codec-derived WebRepresentation and fenced_text. RetrieverBackend::Web is a compatibility projection over this owner, not a second capture path."
claims_anchors = [
  "anchor/crate/sim-lib-web-fetch",
  "anchor/rustdoc/sim-lib-web-fetch/web-fetcher",
]

[[route]]
id = "route/capture-web-evidence"
task = "Capture and replay immutable web evidence"
audiences = ["user", "framework"]
steps = [
  { feature = "feature/sim-agent-net/immutable-web-capture", why = "The web/fetch owner composes legacy retrieval with explicit policy and immutable evidence." },
  { specimen = "recipe/sim-agent-net/crates/sim-lib-web-fetch/01-basics/offline-capture", why = "The network-free fixture proves identical offline replay and versioned re-extraction." },
]

[[feature]]
id = "feature/sim-agent-net/agent-conduct-records"
title = "Pure agent conduct records"
summary = "Describe agent run frames, open lifecycle vocabulary, exact domain budgets, step Cards, and durable hash-linked run journals with effect-safe replay and forks."
owner = "crate/sim-lib-agent-conduct-core"
audiences = ["code", "framework"]
guidance = "Use AgentRunFrame as the one packet passed through conduct steps, AgentStepCard to declare an extension step's Shapes and open outcomes, AgentUsageBudget::narrow for caller/agent/conduct limits, and DurableAgentRun::advance to atomically append each completed production step through the manifest-selected AgentJournalStore. Resume verifies the graph, bindings, Card identity chain, and sealed continuation; reconcile effects before advancing; use receipt_replay for target-free audit, counterfactual_replay only with cassettes, and fork for checkpoint children under equal or narrower authority. MemoryJournalStore adapts the existing MemoryBackend rather than adding a store. Register all Citizens through register_citizens for constructor Shapes and general-purpose codec round trips."
claims_specimens = [
  "recipe/sim-agent-net/crates/sim-lib-agent-conduct-core/01-basics/pure-journal",
]

[[feature]]
id = "feature/sim-agent-net/agent-conduct"
title = "Discoverable topology-backed agent conduct"
summary = "Assemble, inspect, run, and author different agent kinds as validated data-only conduct graphs, including ReAct, plan-act-replan, phased, verify-retry, router-crew, and triage workflows."
owner = "crate/sim-lib-agent-conduct"
audiences = ["user", "code", "framework"]
guidance = "Start here when choosing or authoring an agent control loop. The two conduct crates own codec-stable records and the agent/conduct-v1 certification profile; sim-lib-topology remains the reused parser, normalized graph, registry, scheduler, continuation, budget, reflection, and diagram substrate. Browse with `sim agent conduct list|show|explain`: the projection exposes conduct id and graph fingerprint, normalized topology, required roles and step Cards, capabilities and authority, structural and domain budgets, result Shape, continuation/replay availability, and bounded redacted run reports. Validation rejects missing roles, unrouted Card outcomes, authority mismatches, unbounded effect cycles, and output not admitted through finish or stop before execution. Extend the catalog with a tested .simtopo package and standard or third-party step Cards; never add a kind-specific Rust loop or claim agent vocabulary in the topology owner."
claims_anchors = [
  "anchor/crate/sim-lib-agent-conduct-core",
  "anchor/crate/sim-lib-agent-conduct",
]
claims_specimens = [
  "recipe/sim-agent-net/crates/sim-lib-agent-conduct-core/01-basics/pure-journal",
  "recipe/sim-agent-net/crates/sim-lib-agent-conduct/01-basics/echo-conduct",
  "recipe/sim-agent-net/crates/sim-lib-agent/50-conducts/default",
  "recipe/sim-agent-net/crates/sim-lib-agent/50-conducts/react",
  "recipe/sim-agent-net/crates/sim-lib-agent/50-conducts/plan-act-replan",
  "recipe/sim-agent-net/crates/sim-lib-agent/50-conducts/phased",
  "recipe/sim-agent-net/crates/sim-lib-agent/50-conducts/verify-retry",
  "recipe/sim-agent-net/crates/sim-lib-agent/50-conducts/router-crew",
  "recipe/sim-agent-net/crates/sim-lib-agent/50-conducts/third-party-step",
  "spec-test/sim-agent-net/crates/sim-lib-agent/src/tests/standard_steps",
]
depends_on = [
  "feature/sim-stream/stream-protocol-helpers",
  "feature/sim-agent-net/genai-assembly",
]

[[feature]]
id = "feature/sim-agent-net/agent-conduct-topology-profile"
title = "Validated topology-backed agent conducts"
summary = "Certify delivered topology packages as agent/conduct-v1 workflows, browse the standard data-only agent-kind catalog, bind step Cards explicitly, and run or resume through the topology engine."
owner = "crate/sim-lib-agent-conduct"
audiences = ["code", "framework"]
guidance = "Use load_agent_conduct_catalog with the standard step Cards to load agent/default-v1, react-v1, plan-act-replan-v1, phased-v1, verify-retry-v1, router-crew-v1, and triage-v1 through table-backed topology package sources and the ordinary TopologyRegistry path. Use validate_agent_conduct for the strict RunFrame boundary, Card/outcome-route coverage, metadata-derived roles, capabilities, budgets, and finish-or-stop admission. Use bind_agent_conduct for exact node/Card bindings, then AgentConduct run or step for topology-owned execution and continuation. Add a new kind as a tested .simtopo package; never add a kind-specific Rust loop or type. The projection retains the original TopologyEntry and never creates another graph, parser, registry, or scheduler."
claims_specimens = [
  "recipe/sim-agent-net/crates/sim-lib-agent-conduct/01-basics/echo-conduct",
  "spec-test/sim-agent-net/crates/sim-lib-agent/src/tests/standard_steps",
]
depends_on = ["feature/sim-agent-net/agent-conduct-records"]

[[feature]]
id = "feature/sim-agent-net/agent-single-steps"
title = "Effect-safe single agent steps"
summary = "Run model, tool, component, planning, phase, review, delegation, checkpoint, finish, and stop concerns as independently testable single attempts while topology conducts own every retry and repetition edge."
owner = "crate/sim-lib-agent"
audiences = ["code", "framework"]
guidance = "Use the execute_*_once functions for one component, planning, reflection, review, or delegation attempt; use enter_phase, admit_phase_tool, and complete_phase around ordinary model/component/tool nodes; and admit public results only through execute_finish or execute_stop. Certify standard targets with standard_step_cards. Hosts extend conduct through AgentStepRegistry and AgentStepFactory keyed by Card id, without editing agent or conduct source. Budget admission precedes runner opening, delegation, and effects; child authority is diminished at the EvalFabric boundary; provider endpoint, credentials, transport, preference, hidden reasoning, mutable run state, and retry edges never belong to a step factory."
claims_anchors = [
  "anchor/crate/sim-lib-bridge",
  "anchor/rustdoc/sim-lib-agent/execute_model_turn_once",
  "anchor/rustdoc/sim-lib-agent/model_turn_card",
  "anchor/rustdoc/sim-lib-agent/tool_batch_card",
  "anchor/rustdoc/sim-lib-agent/agent-step-registry",
  "anchor/rustdoc/sim-lib-agent/standard_step_cards",
  "anchor/rustdoc/sim-lib-bridge/run_ask_once",
]
claims_specimens = [
  "spec-test/sim-agent-net/crates/sim-lib-bridge/src/tests/ask",
  "spec-test/sim-agent-net/crates/sim-lib-agent/src/tests/agent_ai_tools",
  "spec-test/sim-agent-net/crates/sim-lib-agent/src/tests/standard_steps",
]
depends_on = [
  "feature/sim-agent-net/agent-conduct-records",
  "feature/sim-agent-net/agent-conduct-topology-profile",
  "feature/sim-agent-net/provider-control",
]

