
[workspace]
resolver = "3"
members = [
  "crates/sim-lib-roadmap",
  "crates/sim-source-deck",
  "crates/sim-roadmap-core",
  "crates/sim-roadmap-refine",
  "crates/sim-roadmap-plan",
  "crates/sim-roadmap-exec-core",
  "crates/sim-lib-roadmap-runner",
  "crates/sim-roadmap-refine/recipes/01-basics/certified-descent",
  "crates/sim-lib-agent-conduct-core",
  "crates/sim-lib-agent-conduct-core/recipes/01-basics/pure-journal",
  "crates/sim-lib-continuity",
  "crates/sim-lib-capability-pack",
  "crates/sim-lib-capability-pack/recipes/01-basics/checked-pack",
  "crates/sim-lib-continuity/recipes/01-basics/hostile-replay",
  "crates/sim-lib-agent-conduct",
  "crates/sim-lib-agent-conduct/recipes/01-basics/echo-conduct",
  "crates/sim-lib-agent",
  "crates/sim-lib-web-fetch",
  "crates/sim-lib-agent-runner-core",
  "crates/sim-lib-agent-runner-core/recipes/01-basics/output-contract-repair",
  "crates/sim-lib-bridge",
  "crates/sim-lib-forge",
  "crates/sim-lib-agent-runner-http",
  "crates/sim-lib-agent-runner-local",
  "crates/sim-lib-agent-runner-process",
  "crates/sim-lib-provider",
  "crates/sim-lib-model-test",
  "crates/sim-lib-model-test-packs",
  "crates/sim-lib-provider-cli",
  "crates/sim-lib-cookbook",
  "crates/sim-lib-mcp",
  "crates/sim-lib-mcp-client",
  "crates/sim-lib-mcp-http",
  "crates/sim-lib-mcp-legacy",
  "crates/sim-lib-mcp-stdio",
  "crates/sim-lib-oauth-core",
  "crates/sim-lib-oauth-jose",
  "crates/sim-lib-oauth-http",
  "crates/sim-lib-openai-server",
  "crates/sim-lib-server",
  "crates/sim-transport-ports",
  "crates/sim-lib-skill",
  "crates/sim-lib-search-http",
  "crates/sim-lib-search",
  "crates/sim-lib-stream-fabric",
  "crates/sim-table-remote",
  "crates/sim-mcp-server",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[workspace.lints.rust]
unsafe_code = "forbid"

# Every Cargo manifest in this repository belongs to its generated contract.
# Focused harnesses and the offline-capture recipe keep their own resolver roots.
[workspace.metadata.sim]
docs-command = "cargo run -p xtask -- simdoc"
validation-commands = [
  "cargo fmt --all --check",
  "cargo test --workspace",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo doc --workspace --no-deps",
  "cargo clippy --workspace --all-features --all-targets -- -D warnings",
  "cargo test --workspace --all-features",
  "cargo run -p xtask -- check-file-sizes",
  "cargo test --manifest-path crates/sim-lib-agent/channel-policy-focused/Cargo.toml",
  "cargo test --manifest-path crates/sim-lib-capability-pack/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-lib-continuity/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-lib-model-test/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-lib-model-test/product-focused/Cargo.toml",
  "cargo test --manifest-path crates/sim-lib-model-test-packs/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-lib-roadmap/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-lib-roadmap-runner/compatibility-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-lib-roadmap-runner/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-roadmap-core/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-roadmap-exec-core/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-roadmap-plan/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-roadmap-refine/focused-tests/Cargo.toml",
  "cargo test --manifest-path crates/sim-source-deck/focused-tests/Cargo.toml",
]
contract-exclusions = [
  { path = "crates/sim-lib-agent/channel-policy-focused", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-agent/channel-policy-focused/Cargo.toml", reason = "Compiles the channel policy module under the narrowed dependency set." },
  { path = "crates/sim-lib-capability-pack/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-capability-pack/focused-tests/Cargo.toml", reason = "Runs the capability-pack closure tests through their own manifest." },
  { path = "crates/sim-lib-continuity/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-continuity/focused-tests/Cargo.toml", reason = "Runs the continuity suite and the hostile-replay binary through their own manifest." },
  { path = "crates/sim-lib-model-test/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-model-test/focused-tests/Cargo.toml", reason = "Compiles the legacy import module under the narrowed dependency set." },
  { path = "crates/sim-lib-model-test/product-focused", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-model-test/product-focused/Cargo.toml", reason = "Loads the offline model-test product projections through their own manifest." },
  { path = "crates/sim-lib-model-test-packs/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-model-test-packs/focused-tests/Cargo.toml", reason = "Compiles the generated portfolio modules under the narrowed dependency set." },
  { path = "crates/sim-lib-roadmap/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-roadmap/focused-tests/Cargo.toml", reason = "Runs the parent suite through this manifest's narrowed dependency set." },
  { path = "crates/sim-lib-roadmap-runner/compatibility-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-roadmap-runner/compatibility-tests/Cargo.toml", reason = "Links the shadow contract without the runner crate." },
  { path = "crates/sim-lib-roadmap-runner/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-lib-roadmap-runner/focused-tests/Cargo.toml", reason = "Qualifies the local executor through its own manifest." },
  { path = "crates/sim-lib-web-fetch/recipes/01-basics/offline-capture", class = "recipe-fixture", consumer = "crates/sim-lib-web-fetch/recipes/01-basics/offline-capture/recipe.toml", reason = "The offline-capture recipe builds this unpublished workspace." },
  { path = "crates/sim-roadmap-core/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-roadmap-core/focused-tests/Cargo.toml", reason = "Runs the admission suite through its own manifest." },
  { path = "crates/sim-roadmap-exec-core/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-roadmap-exec-core/focused-tests/Cargo.toml", reason = "Runs the executor suite through its own manifest." },
  { path = "crates/sim-roadmap-plan/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-roadmap-plan/focused-tests/Cargo.toml", reason = "Compiles the parent library under the narrowed dependency set." },
  { path = "crates/sim-roadmap-refine/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-roadmap-refine/focused-tests/Cargo.toml", reason = "Compiles the parent refiner library under the narrowed dependency set." },
  { path = "crates/sim-source-deck/focused-tests", class = "focused-test-harness", consumer = "cargo test --manifest-path crates/sim-source-deck/focused-tests/Cargo.toml", reason = "Compiles the parent library and the grounded example with the kernel only." },
]
