[package]
name = "sim-lib-mcp-legacy"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Initialize-era MCP compatibility adapter for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
sim-codec-mcp = { version = "0.1.5" }
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }
sim-lib-mcp = { version = "0.1.9", path = "../sim-lib-mcp" }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
sim-kernel = { version = "0.2.1", features = ["test-support"] }

[lints]
workspace = true
