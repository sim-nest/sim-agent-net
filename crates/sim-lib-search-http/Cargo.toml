[package]
name = "sim-lib-search-http"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Provider-neutral, policy-bounded HTTP transport for SIM search codecs."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
sim-config = "0.2.0"
sim-cookbook = "0.3.0"
sim-kernel = "0.3.0"
sim-lib-net-http = "0.1.0"
sim-lib-search-core = "0.1.0"
sim-lib-skill = { version = "0.3.0", path = "../sim-lib-skill" }
sim-lib-web-core = "0.1.0"
sim-shape = "0.3.0"

[build-dependencies]
sim-cookbook-build = "0.1.0"

[dev-dependencies]
sim-kernel = { version = "0.3.0", features = ["test-support"] }

[lints]
workspace = true
