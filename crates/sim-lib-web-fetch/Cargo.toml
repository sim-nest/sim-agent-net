[package]
name = "sim-lib-web-fetch"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Policy-gated immutable web capture for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
sim-codec-doc = "0.2.0"
sim-codec-feed = "0.1.0"
sim-codec-robots = "0.1.0"
sim-kernel = "0.3.0"
sim-cookbook = "0.3.0"
sim-lib-agent-runner-core = { version = "0.3.0", path = "../sim-lib-agent-runner-core" }
sim-lib-net-http = "0.1.0"
sim-lib-net-core = "0.3.0"
sim-lib-web-core = "0.1.0"

[build-dependencies]
sim-cookbook-build = "0.1.0"

[dev-dependencies]
sim-kernel = { version = "0.3.0", features = ["test-support"] }

[lints]
workspace = true
