[package]
name = "sim-lib-openai-server"
version = "0.1.4"
edition = "2024"
license = "MPL-2.0"
description = "OpenAI-compatible gateway skeleton for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
serde_json = "1"
sha2 = "0.10"
sim-citizen = { version = "0.1.0" }
sim-citizen-derive = { version = "0.1.0" }
sim-codec = { version = "0.1.0" }
sim-codec-binary = { version = "0.1.0" }
sim-codec-chat = { version = "0.1.0" }
sim-codec-json = { version = "0.1.0" }
sim-cookbook = { version = "0.1.0" }
sim-kernel = { version = "0.1.0" }
sim-lib-agent-runner-core = { version = "0.1.0", path = "../sim-lib-agent-runner-core" }
sim-lib-core = { version = "0.1.0" }
sim-lib-server = { version = "0.1.0", optional = true, default-features = false, path = "../sim-lib-server" }
sim-lib-stream-core = { version = "0.1.0" }
sim-value = { version = "0.1.0" }
[build-dependencies]
sim-cookbook = { version = "0.1.0" }

[dev-dependencies]
sim-kernel = { version = "0.1", features = ["test-support"] }

[features]
default = []
http = ["dep:sim-lib-server", "sim-lib-server/server-net-http"]

[lints]
workspace = true
