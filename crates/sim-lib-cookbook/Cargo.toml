[package]
name = "sim-lib-cookbook"
version = "0.1.13"
edition = "2024"
license = "MPL-2.0"
description = "Runtime cookbook: operations for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
sim-citizen = { version = "0.1.0" }
sim-citizen-derive = { version = "0.1.0" }
sim-codec = { version = "0.1.4" }
sim-codec-json = { optional = true, version = "0.1.2" }
sim-codec-lisp = { optional = true, version = "0.1.1" }
sim-codec-algol = { optional = true, version = "0.1.2" }
sim-config = { version = "0.1.1" }
sim-cookbook = { version = "0.1.0" }
sim-kernel = { version = "0.1.3" }
sim-value = { version = "0.1.2" }
sim-lib-lang-scheme = { optional = true, version = "0.1.2" }
sim-lib-midi-core = { optional = true, version = "0.1.2" }
sim-lib-agent-runner-core = { version = "0.1.0", optional = true, path = "../sim-lib-agent-runner-core" }
sim-lib-binding = { optional = true, version = "0.1.1" }
sim-lib-control = { optional = true, version = "0.1.1" }
sim-lib-core = { version = "0.1.2" }
sim-lib-dispatch = { optional = true, version = "0.1.0" }
sim-lib-pattern = { optional = true, version = "0.1.1" }
sim-lib-sequence = { optional = true, version = "0.1.1" }
sim-lib-numbers-rational = { optional = true, version = "0.1.1" }
sim-lib-numbers-cas = { optional = true, version = "0.1.2" }
sim-lib-numbers-func = { optional = true, version = "0.1.1" }
sim-lib-numbers-complex = { optional = true, version = "0.1.1" }
sim-lib-numbers-f64 = { optional = true, version = "0.1.1" }
sim-lib-numbers-i64 = { optional = true, version = "0.1.1" }
sim-lib-numbers-arith = { optional = true, version = "0.1.1" }
sim-lib-numbers-bigint = { optional = true, version = "0.1.1" }
sim-lib-numbers-bool = { optional = true, version = "0.1.1" }
sim-lib-numbers-tensor = { optional = true, version = "0.1.3" }
sim-lib-numbers-tensor-bcast = { optional = true, version = "0.1.2" }
sim-lib-numbers-tensor-cmplxf = { optional = true, version = "0.1.1" }
sim-lib-numbers-tensor-rat64 = { optional = true, version = "0.1.1" }
sim-lib-discrete = { optional = true, version = "0.1.3", features = ["runtime"] }
sim-lib-stream-core = { optional = true, version = "0.1.1" }
sim-shape = { version = "0.1.1" }
[build-dependencies]
sim-cookbook = { version = "0.1.0" }

[dev-dependencies]
sim-kernel = { version = "0.1.3", features = ["test-support"] }
sim-test-support = { version = "0.1.0" }

[features]
default = ["seed-recipes"]
seed-recipes = ["dep:sim-codec-algol", "dep:sim-codec-json", "dep:sim-codec-lisp", "dep:sim-lib-lang-scheme", "dep:sim-lib-midi-core", "dep:sim-lib-agent-runner-core", "dep:sim-lib-binding", "dep:sim-lib-control", "dep:sim-lib-dispatch", "dep:sim-lib-pattern", "dep:sim-lib-sequence", "dep:sim-lib-numbers-rational", "dep:sim-lib-numbers-cas", "dep:sim-lib-numbers-func", "dep:sim-lib-numbers-complex", "dep:sim-lib-numbers-f64", "dep:sim-lib-numbers-i64", "dep:sim-lib-numbers-arith", "dep:sim-lib-numbers-bigint", "dep:sim-lib-numbers-bool", "dep:sim-lib-numbers-tensor", "dep:sim-lib-numbers-tensor-bcast", "dep:sim-lib-numbers-tensor-cmplxf", "dep:sim-lib-numbers-tensor-rat64", "dep:sim-lib-discrete", "dep:sim-lib-stream-core"]

[lints]
workspace = true
