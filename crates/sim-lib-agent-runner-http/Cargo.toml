[package]
name = "sim-lib-agent-runner-http"
version = "0.1.7"
edition = "2024"
license = "MPL-2.0"
description = "HTTP-backed model runners for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[lib]
path = "src/lib.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
serde_json = "1"
sim-codec-chat = { version = "0.2.0" }
sim-codec-json = { version = "0.2.0" }
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-agent-runner-core = { version = "0.2.0", path = "../sim-lib-agent-runner-core" }
sim-lib-net-core = { version = "0.2.0" }
sim-lib-openai-server = { version = "0.2.0", path = "../sim-lib-openai-server" }
sim-shape = { version = "0.2.0" }
[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[dev-dependencies]
rcgen = "0.13"

[features]
default = []
tls = ["dep:rustls", "dep:rustls-native-certs"]

[lints]
workspace = true
