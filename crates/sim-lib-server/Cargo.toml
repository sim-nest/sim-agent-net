[package]
name = "sim-lib-server"
version = "0.1.10"
edition = "2024"
license = "MPL-2.0"
description = "Location-transparent server, transport, and eval-fabric runtime for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
serde_json = { version = "1.0", optional = true }
sim-citizen = { version = "0.1.2" }
sim-citizen-derive = { version = "0.1.3" }
sim-codec = { version = "0.1.0" }
sim-codec-binary = { version = "0.1.0" }
sim-codec-binary-base64 = { version = "0.1.0" }
sim-cookbook = { version = "0.1.0" }
sim-kernel = { version = "0.1.3" }
sim-lib-cookbook = { version = "0.1.13", path = "../sim-lib-cookbook" }
sim-lib-core = { version = "0.1.2" }
sim-lib-net-core = { version = "0.1.0" }
sim-lib-stream-core = { version = "0.1.2" }
sim-value = { version = "0.1.2" }
sim-shape = { version = "0.1.0" }
sim-wasm-abi = { version = "0.1.0" }
[build-dependencies]
sim-cookbook = { version = "0.1.0" }

[dev-dependencies]
sim-codec-algol = { version = "0.1.0" }
sim-codec-binary = { version = "0.1.0" }
sim-codec-json = { version = "0.1.0" }
sim-codec-lisp = { version = "0.1.0" }
sim-kernel = { version = "0.1.3", features = ["test-support"] }
sim-test-support = { version = "0.1.0" }
wat = "1.245.1"

[features]
default = []
server-net-http = []
trigger-cron = []
trigger-imap = []
trigger-matrix = ["dep:serde_json"]
trigger-smtp = []
trigger-telegram = ["dep:serde_json"]
trigger-webhook = []
