[package]
name = "sim-lib-agent"
version = "0.1.17"
edition = "2024"
license = "MPL-2.0"
description = "Agent runtime surfaces for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
regex = "1"
serde_json = "1"
sim-config = { version = "0.1.1" }
sim-citizen = { version = "0.2.0" }
sim-citizen-derive = { version = "0.2.0" }
sim-codec = { version = "0.1.8" }
sim-codec-binary = { version = "0.2.1" }
sim-codec-chat = { version = "0.2.1" }
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }
sim-lib-agent-runner-core = { version = "0.2.0", path = "../sim-lib-agent-runner-core" }
sim-lib-agent-runner-http = { version = "0.2.0", optional = true, path = "../sim-lib-agent-runner-http" }
sim-lib-agent-runner-process = { version = "0.1.5", optional = true, path = "../sim-lib-agent-runner-process" }
sim-lib-provider = { version = "0.1.0", path = "../sim-lib-provider" }
sim-lib-cookbook = { version = "0.1.16", optional = true, path = "../sim-lib-cookbook" }
sim-lib-core = { version = "0.2.0" }
sim-lib-numbers-stats = { version = "0.4.0" }
sim-lib-rank = { version = "0.1.4" }
sim-lib-server = { version = "0.1.12", path = "../sim-lib-server" }
sim-lib-stream-fabric = { version = "0.2.1", path = "../sim-lib-stream-fabric" }
sim-lib-stream-core = { version = "0.1.4" }
sim-shape = { version = "0.2.3" }
sim-value = { version = "0.2.0" }
sim-wasm-abi = { version = "0.3.0" }
[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
sim-codec-chat = { version = "0.2.0" }
sim-codec-json = { version = "0.2.0" }
sim-codec-lisp = { version = "0.2.0" }
sim-kernel = { version = "0.2.1", features = ["test-support"] }
sim-lib-bridge = { version = "0.1.6", path = "../sim-lib-bridge" }
sim-lib-cookbook = { version = "0.1.16", path = "../sim-lib-cookbook" }
sim-lib-topology = { version = "0.1.0" }
wat = "1.245.1"

[features]
agent-net = ["sim-lib-server/server-net-http"]
cookbook = ["dep:sim-lib-cookbook"]
default = []
runner-http = ["dep:sim-lib-agent-runner-http"]
runner-ollama = ["dep:sim-lib-agent-runner-http"]
runner-process = ["dep:sim-lib-agent-runner-process"]
