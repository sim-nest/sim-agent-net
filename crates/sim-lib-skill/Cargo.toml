[package]
name = "sim-lib-skill"
version = "0.3.0"
edition = "2024"
license = "MPL-2.0"
description = "Skill cards, policy records, browse metadata, and projections for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
serde_json = { version = "1", optional = true }
sim-citizen = { version = "0.3.0" }
sim-citizen-derive = { version = "0.3.0" }
sim-codec-json = { version = "0.3.0" }
sim-codec-mcp = { optional = true, version = "0.2.0" }
sim-cookbook = { version = "0.3.0" }
sim-kernel = { version = "0.3.0" }
sim-lib-agent = { version = "0.2.0", optional = true, path = "../sim-lib-agent" }
sim-lib-agent-runner-core = { version = "0.3.0", optional = true, path = "../sim-lib-agent-runner-core" }
sim-lib-agent-runner-process = { version = "0.2.0", optional = true, path = "../sim-lib-agent-runner-process" }
sim-lib-exec = { version = "0.2.0", optional = true }
sim-lib-core = { version = "0.3.0" }
sim-lib-openai-server = { version = "0.4.0", optional = true, path = "../sim-lib-openai-server" }
sim-lib-surface-card = { version = "0.2.0" }
sim-shape = { version = "0.3.0" }
sim-value = { version = "0.3.0" }
[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
sim-codec-binary = { version = "0.3.0" }
sim-kernel = { version = "0.3.0", features = ["test-support"] }

[features]
agent = ["dep:sim-lib-agent"]
cache = []
cassette = []
default = []
http = ["dep:serde_json"]
mcp = ["dep:sim-codec-mcp"]
openai = ["dep:serde_json", "dep:sim-lib-openai-server"]
process = ["dep:serde_json", "dep:sim-lib-agent-runner-core", "dep:sim-lib-agent-runner-process", "dep:sim-lib-exec"]
runner = ["dep:sim-lib-agent"]
serve = ["mcp"]

[lints]
workspace = true
