[package]
name = "sim-lib-bridge"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Checked BRIDGE packet runtime for SIM model exchanges."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[lib]
path = "src/lib.rs"

[dependencies]
sim-codec-bridge = { git = "https://github.com/sim-nest/sim-codecs", rev = "c6c3db08e931074c824b211a6785aa44abcfd119", package = "sim-codec-bridge" }
sim-cookbook = { version = "0.1.0" }
sim-kernel = { version = "0.1.3" }
sim-lib-agent-runner-core = { version = "0.1.0", path = "../sim-lib-agent-runner-core" }
sim-lib-stream-fabric = { version = "0.1.4", path = "../sim-lib-stream-fabric" }
sim-shape = { version = "0.1.1" }
sim-value = { version = "0.1.0" }

[build-dependencies]
sim-cookbook = { version = "0.1.0" }

[dev-dependencies]
sim-kernel = { version = "0.1.3", features = ["test-support"] }

[lints]
workspace = true
