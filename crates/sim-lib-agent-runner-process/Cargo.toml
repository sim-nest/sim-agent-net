[package]
name = "sim-lib-agent-runner-process"
version = "0.1.5"
edition = "2024"
license = "MPL-2.0"
description = "Local subprocess-backed model runners for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
serde_json = "1"
sim-codec = { version = "0.1.7" }
sim-codec-chat = { version = "0.2.0" }
sim-codec-json = { version = "0.2.0" }
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-agent-runner-core = { version = "0.2.0", path = "../sim-lib-agent-runner-core" }
[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
sim-kernel = { version = "0.2.0", features = ["test-support"] }
