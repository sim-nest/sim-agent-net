[package]
name = "sim-lib-model-test"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Loadable self-checking model tasks and honest candidate identity for SIM studies."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[lib]
path = "src/lib.rs"

[dependencies]
sim-kernel = { version = "0.3.0" }
sim-lib-provider = { version = "0.1.0", path = "../sim-lib-provider" }
sim-study-core = { version = "0.1.0" }
sim-lib-study = { version = "0.1.0" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
