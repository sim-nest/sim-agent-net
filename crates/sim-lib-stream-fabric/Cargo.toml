[package]
name = "sim-lib-stream-fabric"
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
description = "Content-addressed distributed evaluation for remote stream realization."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
sim-codec-binary = { version = "0.1.0" }
sim-kernel = { version = "0.1.0" }
sim-value = { version = "0.1.0" }
sim-lib-server = { version = "0.1.0", path = "../sim-lib-server" }
sim-lib-stream-core = { version = "0.1.0" }
sim-run-core = { version = "0.1.1" }

[dev-dependencies]
sim-codec-lisp = { version = "0.1.0" }
sim-kernel = { version = "0.1", features = ["test-support"] }
sim-lib-rank = { version = "0.1.0" }

[lints]
workspace = true
