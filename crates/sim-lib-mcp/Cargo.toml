[package]
name = "sim-lib-mcp"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = "Library-only MCP surface projection for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-agent-net"
homepage = "https://github.com/sim-nest/sim-agent-net"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sim-cancel = { version = "0.1.0" }
sim-citizen = { version = "0.3.0" }
sim-citizen-derive = { version = "0.3.0" }
sim-codec = { optional = true, version = "0.2.0" }
sim-codec-json = { version = "0.3.0" }
sim-codec-mcp = { version = "0.2.0" }
sim-cookbook = { version = "0.3.0" }
sim-kernel = { version = "0.3.0" }
sim-lib-agent-runner-core = { version = "0.3.0", optional = true, path = "../sim-lib-agent-runner-core" }
sim-lib-core = { version = "0.3.0" }
sim-lib-net-core = { version = "0.3.0" }
sim-lib-protected-state = { version = "0.1.0" }
sim-lib-server = { version = "0.2.0", optional = true, path = "../sim-lib-server" }
sim-lib-skill = { version = "0.3.0", optional = true, path = "../sim-lib-skill" }
sim-lib-search = { version = "0.1.0", optional = true, path = "../sim-lib-search" }
sim-lib-stream-combinators = { optional = true, version = "0.2.0" }
sim-lib-stream-core = { optional = true, version = "0.2.0" }
sim-lib-stream-fabric = { version = "0.3.0", optional = true, path = "../sim-lib-stream-fabric" }
sim-run-core = { version = "0.4.0", optional = true }
sim-shape = { version = "0.3.0" }
sim-value = { version = "0.3.0" }
[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
sim-codec-lisp = { version = "0.3.0" }
sim-kernel = { version = "0.3.0", features = ["test-support"] }
sim-lib-agent = { version = "0.2.0", path = "../sim-lib-agent" }
sim-lib-openai-server = { version = "0.4.0", path = "../sim-lib-openai-server" }
sim-lib-skill = { version = "0.3.0", features = ["agent", "openai"], path = "../sim-lib-skill" }

[features]
cassette = []
client = ["skill"]
default = []
progress = ["stream"]
sampling = ["dep:sim-lib-agent-runner-core"]
serve = ["stdio", "skill", "dep:sim-run-core", "dep:sim-lib-search"]
skill = ["dep:sim-lib-skill"]
stdio = ["dep:sim-codec"]
stream = ["dep:sim-lib-stream-core", "dep:sim-lib-stream-fabric", "dep:sim-lib-stream-combinators"]

[lints]
workspace = true
